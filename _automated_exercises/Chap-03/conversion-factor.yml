word: conversion factor
for-chapter: 3
valid:
- A dimensionless ratio of equal quantities used to convert between commensurate units.
- A ratio that multiplies a starting quantity to express it in another unit.
- A flavor of one whose units specify the direction of a unit conversion.
- The quotient of two equal quantities expressed with different units.
- A multiplier such as meters per mile that cancels the starting unit and leaves the
  target unit.
invalid:
- text: A two-dimensional space marked by two perpendicular number lines.
  justification: This describes coordinate plane, not conversion factor. In this chapter,
    conversion factor refers to a dimensionless ratio of equal quantities used to
    convert between commensurate units.
- text: Dimensions formed by multiplying or dividing base dimensions.
  justification: This describes derived dimensions, not conversion factor. In this
    chapter, conversion factor refers to a dimensionless ratio of equal quantities
    used to convert between commensurate units.
- text: Units formed by multiplying or dividing base units.
  justification: This describes derived units, not conversion factor. In this chapter,
    conversion factor refers to a dimensionless ratio of equal quantities used to
    convert between commensurate units.
- text: Having the pure-number dimension, with no combination of base dimensions.
  justification: This describes dimensionless, not conversion factor. In this chapter,
    conversion factor refers to a dimensionless ratio of equal quantities used to
    convert between commensurate units.
- text: Dimensionless ratios formed by dividing two exactly equal quantities.
  justification: This describes flavors of one, not conversion factor. In this chapter,
    conversion factor refers to a dimensionless ratio of equal quantities used to
    convert between commensurate units.
- text: A one-dimensional line on which points represent values of a quantity.
  justification: This describes number line, not conversion factor. In this chapter,
    conversion factor refers to a dimensionless ratio of equal quantities used to
    convert between commensurate units.
- text: Change in a primary quantity with respect to one variable while other variables
    are held constant.
  justification: This describes partial change, not conversion factor. In this chapter,
    conversion factor refers to a dimensionless ratio of equal quantities used to
    convert between commensurate units.
- text: A word that signals division, with the following quantity in the denominator.
  justification: This describes per, not conversion factor. In this chapter, conversion
    factor refers to a dimensionless ratio of equal quantities used to convert between
    commensurate units.
- text: A location in a space that corresponds to one or more coordinate values.
  justification: This describes point, not conversion factor. In this chapter, conversion
    factor refers to a dimensionless ratio of equal quantities used to convert between
    commensurate units.
- text: A number with no unit designation, such as seven or pi.
  justification: This describes pure number, not conversion factor. In this chapter,
    conversion factor refers to a dimensionless ratio of equal quantities used to
    convert between commensurate units.

word: units
for-chapter: 3
valid:
- Standardized measures that specify how much of a quantity is present.
- The named measurement scale attached to a pure number, such as meters or seconds.
- Conventional standards used to express amounts of a particular kind.
- The measurement component that distinguishes five meters from five seconds.
- Named measures that make the numerical part of a quantity interpretable.

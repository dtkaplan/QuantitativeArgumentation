word: derived dimensions
for-chapter: 3
valid:
- Dimensions formed by multiplying or dividing base dimensions.
- Combinations such as length divided by time that describe more complex quantities.
- Dimensional expressions built from foundational dimensions through arithmetic operations.
- The products or ratios of base dimensions associated with derived quantities.
- Dimensions such as area or velocity that can be expressed using base dimensions.
invalid:
- text: Units formed by multiplying or dividing base units.
  justification: This describes derived units, not derived dimensions. In this chapter,
    derived dimensions refers to dimensions formed by multiplying or dividing base
    dimensions.
- text: Having the pure-number dimension, with no combination of base dimensions.
  justification: This describes dimensionless, not derived dimensions. In this chapter,
    derived dimensions refers to dimensions formed by multiplying or dividing base
    dimensions.
- text: Dimensionless ratios formed by dividing two exactly equal quantities.
  justification: This describes flavors of one, not derived dimensions. In this chapter,
    derived dimensions refers to dimensions formed by multiplying or dividing base
    dimensions.
- text: A one-dimensional line on which points represent values of a quantity.
  justification: This describes number line, not derived dimensions. In this chapter,
    derived dimensions refers to dimensions formed by multiplying or dividing base
    dimensions.
- text: Change in a primary quantity with respect to one variable while other variables
    are held constant.
  justification: This describes partial change, not derived dimensions. In this chapter,
    derived dimensions refers to dimensions formed by multiplying or dividing base
    dimensions.
- text: A word that signals division, with the following quantity in the denominator.
  justification: This describes per, not derived dimensions. In this chapter, derived
    dimensions refers to dimensions formed by multiplying or dividing base dimensions.
- text: A location in a space that corresponds to one or more coordinate values.
  justification: This describes point, not derived dimensions. In this chapter, derived
    dimensions refers to dimensions formed by multiplying or dividing base dimensions.
- text: A number with no unit designation, such as seven or pi.
  justification: This describes pure number, not derived dimensions. In this chapter,
    derived dimensions refers to dimensions formed by multiplying or dividing base
    dimensions.
- text: A standardized measure consisting of a pure number and a unit, optionally
    with a descriptor.
  justification: This describes quantity, not derived dimensions. In this chapter,
    derived dimensions refers to dimensions formed by multiplying or dividing base
    dimensions.
- text: The International System of Units, the primary official system for defining
    units.
  justification: This describes SI, not derived dimensions. In this chapter, derived
    dimensions refers to dimensions formed by multiplying or dividing base dimensions.

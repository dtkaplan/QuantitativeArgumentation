word: rate
for-chapter: 4
valid:
- A ratio of two quantities where division expresses a relationship between their
  underlying dimensions.
- A quantity formed by dividing one quantity by another to describe their relationship.
- A ratio used to relate dimensions, such as distance traveled to fuel consumed.
- A quantity whose units show how one measured amount relates to another.
- A quotient of quantities interpreted as a relationship, such as dollars per hour.

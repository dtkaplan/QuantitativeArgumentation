word: order of magnitude
for-chapter: 5
valid:
- A factor-of-ten scale used to describe how much larger or smaller one number is
  than another.
- A difference in magnitude that indicates a ratio by a power of ten.
- A way to compare sizes by counting powers of ten rather than subtracting values.
- A scale comparison such as two orders of magnitude between one hundred and ten thousand.
- A logarithmic measure of relative size that is useful when quantities span a broad
  range.

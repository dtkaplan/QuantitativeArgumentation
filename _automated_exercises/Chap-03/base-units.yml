word: base units
for-chapter: 3
valid:
- Fundamental SI units that are not defined in terms of one another.
- The seven independent units that provide building blocks for SI units.
- Units such as the second, meter, kilogram, and kelvin from which derived units are
  composed.
- The primary measurement units underlying the International System of Units.
- SI units whose definitions do not depend on other base units.
invalid:
- text: A unit for counting people, from the Latin word for head.
  justification: This describes capita, not base units. In this chapter, base units
    refers to fundamental si units that are not defined in terms of one another.
- text: Accounting for other variables while examining a relationship of interest.
  justification: This describes controlling for, not base units. In this chapter,
    base units refers to fundamental si units that are not defined in terms of one
    another.
- text: A dimensionless ratio of equal quantities used to convert between commensurate
    units.
  justification: This describes conversion factor, not base units. In this chapter,
    base units refers to fundamental si units that are not defined in terms of one
    another.
- text: A two-dimensional space marked by two perpendicular number lines.
  justification: This describes coordinate plane, not base units. In this chapter,
    base units refers to fundamental si units that are not defined in terms of one
    another.
- text: Dimensions formed by multiplying or dividing base dimensions.
  justification: This describes derived dimensions, not base units. In this chapter,
    base units refers to fundamental si units that are not defined in terms of one

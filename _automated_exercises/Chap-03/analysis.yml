word: analysis
for-chapter: 3
valid:
- Examining a system by breaking it into contributing components.
- A process of separating a complex situation into parts to understand their contributions.
- Systematic examination of components or relationships to clarify a quantitative
  question.
- Reasoning that loosens a whole problem into pieces that can be studied.
- The study of how component changes contribute to an overall result.

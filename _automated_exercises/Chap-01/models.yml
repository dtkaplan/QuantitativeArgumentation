word: models
for-chapter: 1
valid:
- Representations of items, processes, or settings that are easier to use than the
  reality.
- Simplified representations built to help people understand, test, or make decisions
  about something.
- Substitutes for real-world situations that can be examined or modified more conveniently.
- Representations used to reason about a real-world item, process, or setting.
- Constructs that stand in for reality and help answer questions about it.

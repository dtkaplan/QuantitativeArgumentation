word: variable
for-chapter: 2
valid:
- A column in a data frame that records one property across its specimens.
- A named feature whose values are recorded for each row or specimen.
- A data-frame column containing values of a consistent type for different objects.
- A characteristic recorded across a collection of specimens, such as height or sex.
- One field in a data table whose entries describe the corresponding specimens.
invalid:

  justification: This describes analysis, not variable. In this chapter, variable
    refers to a column in a data frame that records one property across its specimens.
- text: Fundamental dimensions from which derived dimensions are formed.
  justification: This describes base dimensions, not variable. In this chapter, variable
    refers to a column in a data frame that records one property across its specimens.
- text: Fundamental SI units that are not defined in terms of one another.
  justification: This describes base units, not variable. In this chapter, variable
    refers to a column in a data frame that records one property across its specimens.
- text: A unit for counting people, from the Latin word for head.
  justification: This describes capita, not variable. In this chapter, variable refers
    to a column in a data frame that records one property across its specimens.
- text: Accounting for other variables while examining a relationship of interest.
  justification: This describes controlling for, not variable. In this chapter, variable

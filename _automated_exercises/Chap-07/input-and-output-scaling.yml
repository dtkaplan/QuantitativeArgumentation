word: input and output scaling
for-chapter: 7
valid:
  - A strategy for using quantity-valued inputs and outputs with core functions defined for pure numbers.
  - Applying quantity scales to a core function's input and output axes to model a quantity-to-quantity relationship.
  - Choosing labels and intervals on both axes so pure-number coordinates correspond to quantities.
  - A way to shift and stretch the input and output scales of a core modeling function for a particular model.
  - Mapping quantity inputs to pure-number function inputs and interpreting pure-number outputs as quantities.
invalid:
  - text: |
      Rewriting a core function's algorithm so that it accepts any number of quantity-valued inputs.
    justification: |
      Scaling changes how the axes correspond to quantities; it does not rewrite the function's algorithm or number of inputs.
  - text: |
      Changing only the output scale while keeping the input axis as the quantity scale.
    justification: |
      The technique scales both input and output; core functions use pure numbers on both axes.
  - text: |
      Changing only the input scale while leaving the output as a pure number.
    justification: |
      Input and output scaling assigns quantity scales to both axes so the function represents a quantity-to-quantity relationship.
  - text: |
      Replacing all quantities in a model with unitless numbers and discarding their units.
    justification: |
      Scaling allows quantities and their units to be represented on the axes; it does not discard what the quantities mean.
  - text: |
      Converting a measured quantity from one unit to another without using a function.
    justification: |
      Unit conversion alone is not the chapter's scaling strategy, which relates quantity axes to a core function's pure-number axes.
  - text: |
      Reading quantity values from the black grid and pure-number values from the blue axes.
    justification: |
      The chapter says the black grid gives pure-number coordinates, while the blue axes give quantity values.
  - text: |
      Making every core modeling function produce the same output for every possible input.
    justification: |
      Scaling changes the axis scales, not the relationship shape or the function's dependence on input.
  - text: |
      Reversing a function so that its quantity output becomes its input and its input becomes the output.
    justification: |
      Scaling maps quantities to and from the existing input-output axes; it does not reverse their roles.
  - text: |
      A rule that forces input quantities and output quantities to use the same units.
    justification: |
      The two axes represent potentially different quantities, each with its own appropriate units and scale.
  - text: |
      A procedure for measuring whether a system's dimensions are interconnected.
    justification: |
      That concerns describing a system. Input and output scaling adapts a core function's numerical axes to quantities.
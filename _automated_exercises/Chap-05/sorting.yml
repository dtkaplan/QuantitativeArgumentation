word: sorting
for-chapter: 5
valid:
- Arranging values in order so their relative sizes are easier to compare.
- Putting data from smallest to largest or largest to smallest.
- An ordering operation that makes patterns in a set of values easier to see.
- Rearranging records according to a value, such as GDP, to support visual comparison.
- Organizing observations by rank rather than leaving them in an arbitrary order.

word: SIR model
for-chapter: 1
valid:
- An epidemic model that tracks susceptible, infective, and recovered people over
  time.
- A bookkeeping model that uses population counts to represent infection and recovery.
- A model with susceptible, infective, and recovered groups that simulates an epidemic's
  progression.
- A representation of an outbreak in which infections move people from susceptible
  to infective and then recovered.
- An epidemic model that calculates changing counts of susceptible, infective, and
  recovered people.

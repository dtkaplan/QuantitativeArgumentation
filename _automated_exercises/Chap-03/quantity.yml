word: quantity
for-chapter: 3
valid:
- A standardized measure consisting of a pure number and a unit, optionally with a
  descriptor.
- A measurable amount expressed with a numerical value and an appropriate unit.
- A combination of how much, the unit used to measure it, and sometimes what substance
  is meant.
- A measurement such as five meters, not merely the number five.
- A standardized expression of an amount that preserves what kind of thing is measured.
invalid:
- text: The International System of Units, the primary official system for defining

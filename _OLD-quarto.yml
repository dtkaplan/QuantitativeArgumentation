  navbar:
    title: "<br>Quantitative Argumentation</br>"
     
format:
  live-html:
    theme: litera
    css: styles.css
    toc: true
    cell-options:
      lines: 3
      render-df: gt
    number-sections: true
    number-depth: 2
    mainfont: "Atkinson Hyperlegible"
    
  
engine: knitr

# Get around a bug in the current version of Mathjax:
# Bug is that \mbox{} doesn't work.
# html-math-method:
#   method: mathjax
#   url: "https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.2/MathJax.js?config=TeX-AMS-MML_HTMLorMML"

# Enable webR
webr:
  channel-type: 'automatic'
  repos: ["https://dtkaplan.r-universe.dev"]
  packages: ['mosaicCalc', 'ggplot2', 'ggformula', "dplyr"]
filters:
  - shinylive
  - live
  - si
  - _extensions/exercise/exercise.lua


critic-mode: markup
  
crossref:
  eq-title: "Math expression"
  eq-prefix: "Math expression"
  thm-title: "Enrichment"

word: pure number
for-chapter: 3
valid:
- A number with no unit designation, such as seven or pi.
- A quantity component that carries no unit and has dimension one.
- A numerical value considered without a unit such as meters or seconds.
- A dimensionless number used as the numeric part of a quantity.
- A number that is not itself a measure of a specified unit.
invalid:
- text: A standardized measure consisting of a pure number and a unit, optionally
    with a descriptor.
  justification: This describes quantity, not pure number. In this chapter, pure number
    refers to a number with no unit designation, such as seven or pi.
- text: The International System of Units, the primary official system for defining
    units.
  justification: This describes SI, not pure number. In this chapter, pure number
    refers to a number with no unit designation, such as seven or pi.
- text: A collection of quantities whose values identify locations within it.
  justification: This describes space, not pure number. In this chapter, pure number

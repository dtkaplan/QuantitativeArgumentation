word: state
for-chapter: 13
valid:
  - The set of quantities that completely describes a system's configuration at an instant.
  - A system's instantaneous configuration, represented by one or more quantities.
  - The information about a system at a moment needed to determine its subsequent change.
  - A point in state space specifying the system's current values.
  - The current values of the quantities that describe how a dynamical system is configured.
invalid:
  - text: "The entire history of the system from its beginning to the present."
    justification: "The state is an instantaneous description; the history is represented by a time series or trajectory."
  - text: "A single measurement that never changes over time."
    justification: "A state can contain several quantities and may change as the system evolves."
  - text: "The set of all possible configurations of a system."
    justification: "That is the state space; a state is one configuration within it."
  - text: "A rule that maps the current system configuration to its rate of change."
    justification: "That is the dynamical rule; the state is its input."
  - text: "The physical mechanism that causes a system to move."
    justification: "The state describes the system's current configuration, not the mechanism itself."
  - text: "A list of all potential future outcomes with their probabilities."
    justification: "That describes a probability distribution; a state is the current configuration."
  - text: "The rate at which the system's position changes."
    justification: "That is velocity; the state may include position and velocity among its quantities."
  - text: "A point that must lie outside the system's possible values."
    justification: "A state is a possible configuration and therefore belongs to the system's state space."
  - text: "A description that may omit quantities needed to determine the system's configuration."
    justification: "The chapter defines state as a complete description of the instantaneous configuration."
  - text: "The path traced by a system as it moves through time."
    justification: "That path is a trajectory; a state is one instantaneous point along it."

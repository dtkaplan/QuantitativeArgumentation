word: capita
for-chapter: 3
valid:
- A unit for counting people, from the Latin word for head.
- The people-counting unit used in expressions such as per capita.
- A base unit for amounts of people rather than their mass or volume.
- A unit that counts persons or context-specific people, such as students or passengers.
- The unit of person-count used in quantitative descriptions of populations.

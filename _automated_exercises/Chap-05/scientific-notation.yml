word: scientific notation
for-chapter: 5
valid:
- A number format that expresses a value as a mantissa multiplied by a power of ten.
- A compact representation using a coefficient and an integer exponent on ten.
- A way to write very large or small values without listing many zeros.
- A numerical format in which the mantissa and exponent separately show significant
  digits and scale.
- A notation such as 9.461 times ten to the twelfth for representing a large value.

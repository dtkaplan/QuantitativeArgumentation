word: heuristic reasoning
for-chapter: 1
valid:
- Fast, broadly applicable reasoning that uses useful but fallible rules of thumb.
- Common-sense reasoning that helps people respond efficiently to situations.
- Reasoning based on practical links that are often useful but not guaranteed to be
  correct.
- A flexible way to draw conclusions quickly from familiar patterns and experience.
- Reasoning that is widely useful in everyday life, though less certain than formal
  reasoning.

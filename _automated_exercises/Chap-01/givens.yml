word: givens
for-chapter: 1
valid:
- The facts, beliefs, assumptions, and observations available at the start of reasoning.
- Starting information from which reasoning extracts new meaning or beliefs.
- What a reasoner brings to a reasoning process before drawing a conclusion.
- Premises, perceptions, knowledge, and impressions used as starting points for reasoning.
- Initial information that reasoning uses to reach new understandings.

  justification: This describes SI, not quantity. In this chapter, quantity refers
    to a standardized measure consisting of a pure number and a unit, optionally with
    a descriptor.
- text: A collection of quantities whose values identify locations within it.
  justification: This describes space, not quantity. In this chapter, quantity refers

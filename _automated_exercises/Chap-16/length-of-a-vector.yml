word: length of a vector
for-chapter: 16
valid:
  - The vector's magnitude, representing its distance from the origin.
  - A measure of a vector's size independent of its direction.
  - The Euclidean distance from the vector's starting point to its endpoint.
  - A scalar magnitude computed from a vector's components.
  - The distance represented by a vector when its components are treated as coordinates.
invalid:
  - text: "The number of components that make up a vector."
    justification: "Component count is the vector's dimension; length is its magnitude."
  - text: "The distance between the endpoints of two different vectors."
    justification: "Vector length describes one vector's magnitude, not the distance between two endpoints."
  - text: "The direction in which a vector points."
    justification: "Direction is distinct from length; vectors can have the same direction but different lengths."
  - text: "A signed measure that is negative whenever a vector points left."
    justification: "Length is nonnegative; direction is represented separately from magnitude."
  - text: "The sum of all the components of a vector."
    justification: "Length is a magnitude computed from components, not generally their simple sum."
  - text: "A measure of how closely two vectors point in the same direction."
    justification: "That is alignment; length measures the size of a single vector."
  - text: "The scalar result of multiplying corresponding components of two vectors."
    justification: "That is the dot product; length is a property of one vector."
  - text: "The number of dimensions in the space containing a vector."
    justification: "A vector's space dimension is not the vector's length or magnitude."
  - text: "The amount of function output produced by moving one unit uphill."
    justification: "That is related to a directional rate of change; vector length is geometric magnitude."
  - text: "A coordinate identifying where the vector ends."
    justification: "The endpoint coordinates describe a vector's position; length is the distance from its start to end."

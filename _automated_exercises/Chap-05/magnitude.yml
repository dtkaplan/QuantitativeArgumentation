word: magnitude
for-chapter: 5
valid:
- A measure of the size of a number, closely related to its exponent in scientific
  notation.
- A logarithmic description of how large or small a pure number is.
- The scale position that indicates a number's size across powers of ten.
- A value used to compare numbers that differ greatly in size.
- A concise indicator of numerical scale, distinct from the number's exact value.

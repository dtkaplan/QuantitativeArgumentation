word: hypothesis
for-chapter: 8
valid:
  - A probability distribution used as a proposed account of how the world produces observations.
  - A model-based explanation whose implications can be compared with observed data.
  - A proposed description of a system, represented by a distribution over possible outcomes.
  - An explanatory model that can be assessed by how well it accounts for observations.
  - A testable account of a phenomenon that guides interpretation of evidence.
invalid:
  - text: "A fact that cannot be questioned or compared with evidence."
    justification: "A hypothesis is a proposal whose implications can be examined against observations."
  - text: "A measurement collected directly from the world."
    justification: "Measurements are data; a hypothesis is a proposed account used to interpret data."
  - text: "A probability distribution that assigns the same weight to every outcome."
    justification: "A hypothesis may be represented by a probability distribution, but it need not be uniform."
  - text: "A number summarizing the average of observed values."
    justification: "That is a mean; a hypothesis is an explanatory model or proposed account."
  - text: "A random outcome generated by a computer simulation."
    justification: "A simulated value is an output; the hypothesis is the model used to generate or explain outcomes."
  - text: "A conclusion that must be accepted before any observations are made."
    justification: "A hypothesis is open to assessment and revision in light of evidence."
  - text: "A statement that describes only how uncertain a measurement is."
    justification: "Uncertainty is about unknown values; a hypothesis proposes how the system or data are generated."
  - text: "A rule for calculating the standard deviation of a sample."
    justification: "Standard deviation measures spread; it is not an explanatory hypothesis."
  - text: "A list of all observations gathered during an investigation."
    justification: "That is data; hypotheses are compared by their ability to account for those observations."
  - text: "An explanation that becomes true whenever its likelihood is largest."
    justification: "A higher likelihood gives relative support among hypotheses, not proof that one is true."

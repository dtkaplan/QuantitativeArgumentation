word: controlling for
for-chapter: 3
valid:
- Accounting for other variables while examining a relationship of interest.
- A method for isolating one variable's contribution by holding other influences constant.
- Adjusting an analysis so other context-setting factors do not confound the relationship
  studied.
- Considering one factor while statistically accounting for additional factors.
- Separating the effect associated with one variable from the effects of others.
invalid:
- text: A dimensionless ratio of equal quantities used to convert between commensurate
    units.
  justification: This describes conversion factor, not controlling for. In this chapter,
    controlling for refers to accounting for other variables while examining a relationship
    of interest.
- text: A two-dimensional space marked by two perpendicular number lines.
  justification: This describes coordinate plane, not controlling for. In this chapter,
    controlling for refers to accounting for other variables while examining a relationship
    of interest.
- text: Dimensions formed by multiplying or dividing base dimensions.
  justification: This describes derived dimensions, not controlling for. In this chapter,
    controlling for refers to accounting for other variables while examining a relationship
    of interest.
- text: Units formed by multiplying or dividing base units.
  justification: This describes derived units, not controlling for. In this chapter,
    controlling for refers to accounting for other variables while examining a relationship
    of interest.
- text: Having the pure-number dimension, with no combination of base dimensions.
  justification: This describes dimensionless, not controlling for. In this chapter,
    controlling for refers to accounting for other variables while examining a relationship
    of interest.
- text: Dimensionless ratios formed by dividing two exactly equal quantities.
  justification: This describes flavors of one, not controlling for. In this chapter,
    controlling for refers to accounting for other variables while examining a relationship
    of interest.
- text: A one-dimensional line on which points represent values of a quantity.
  justification: This describes number line, not controlling for. In this chapter,
    controlling for refers to accounting for other variables while examining a relationship
    of interest.
- text: Change in a primary quantity with respect to one variable while other variables
    are held constant.
  justification: This describes partial change, not controlling for. In this chapter,
    controlling for refers to accounting for other variables while examining a relationship
    of interest.
- text: A word that signals division, with the following quantity in the denominator.
  justification: This describes per, not controlling for. In this chapter, controlling
    for refers to accounting for other variables while examining a relationship of
    interest.
- text: A location in a space that corresponds to one or more coordinate values.
  justification: This describes point, not controlling for. In this chapter, controlling
    for refers to accounting for other variables while examining a relationship of
    interest.

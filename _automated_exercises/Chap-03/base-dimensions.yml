word: base dimensions
for-chapter: 3
valid:
- Fundamental dimensions from which derived dimensions are formed.
- The basic kinds of quantity, such as time, length, mass, temperature, capita, and
  worth.
- Dimension symbols that are not defined by multiplying or dividing other dimensions.
- The foundational dimensions used to express more complex dimensional relationships.
- Independent quantity dimensions that serve as building blocks for derived dimensions.
invalid:
- text: Fundamental SI units that are not defined in terms of one another.
  justification: This describes base units, not base dimensions. In this chapter,
    base dimensions refers to fundamental dimensions from which derived dimensions
    are formed.
- text: A unit for counting people, from the Latin word for head.
  justification: This describes capita, not base dimensions. In this chapter, base
    dimensions refers to fundamental dimensions from which derived dimensions are
    formed.
- text: Accounting for other variables while examining a relationship of interest.
  justification: This describes controlling for, not base dimensions. In this chapter,
    base dimensions refers to fundamental dimensions from which derived dimensions
    are formed.
- text: A dimensionless ratio of equal quantities used to convert between commensurate
    units.
  justification: This describes conversion factor, not base dimensions. In this chapter,
    base dimensions refers to fundamental dimensions from which derived dimensions
    are formed.
- text: A two-dimensional space marked by two perpendicular number lines.
  justification: This describes coordinate plane, not base dimensions. In this chapter,
    base dimensions refers to fundamental dimensions from which derived dimensions
    are formed.
- text: Dimensions formed by multiplying or dividing base dimensions.
  justification: This describes derived dimensions, not base dimensions. In this chapter,
    base dimensions refers to fundamental dimensions from which derived dimensions
    are formed.
- text: Units formed by multiplying or dividing base units.
  justification: This describes derived units, not base dimensions. In this chapter,
    base dimensions refers to fundamental dimensions from which derived dimensions
    are formed.
- text: Having the pure-number dimension, with no combination of base dimensions.
  justification: This describes dimensionless, not base dimensions. In this chapter,
    base dimensions refers to fundamental dimensions from which derived dimensions
    are formed.
- text: Dimensionless ratios formed by dividing two exactly equal quantities.
  justification: This describes flavors of one, not base dimensions. In this chapter,
    base dimensions refers to fundamental dimensions from which derived dimensions
    are formed.
- text: A one-dimensional line on which points represent values of a quantity.
  justification: This describes number line, not base dimensions. In this chapter,
    base dimensions refers to fundamental dimensions from which derived dimensions
    are formed.

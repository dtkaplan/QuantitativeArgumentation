word: formal reasoning
for-chapter: 1
valid:
- Reasoning that applies explicit rules whose correct application yields certain conclusions.
- A chain of steps where each link is either correct or in error.
- Deduction or proof-like reasoning based on reliable rules.
- A narrow but dependable form of reasoning when its rules are followed correctly.
- Reasoning whose validity depends on the correctness of each step, not on how plausible
  it sounds.

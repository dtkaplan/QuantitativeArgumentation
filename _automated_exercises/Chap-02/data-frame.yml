word: data frame
for-chapter: 2
valid:
- A rectangular array of data organized into rows and columns.
- A spreadsheet-like structure in which rows record specimens and columns record variables.
- A structured table whose cells contain values for variables and specimens.
- An organization of data where each row describes one object and each column a measured
  dimension.
- A rectangular data structure that stores consistent records for objects of one type.
invalid:
- text: An aspect, property, or characteristic of an object or system.
  justification: This describes dimension, not data frame. In this chapter, data frame
    refers to a rectangular array of data organized into rows and columns.
- text: The kind of object represented by every specimen in a data frame.
  justification: This describes object type, not data frame. In this chapter, data
    frame refers to a rectangular array of data organized into rows and columns.
- text: A procedure for translating a dimension into a measurable quantity.
  justification: This describes operationalization, not data frame. In this chapter,
    data frame refers to a rectangular array of data organized into rows and columns.
- text: A subset of specimens selected from a larger population for study.
  justification: This describes sample, not data frame. In this chapter, data frame
    refers to a rectangular array of data organized into rows and columns.
- text: One individual object or event represented by a row in a data frame.
  justification: This describes specimen, not data frame. In this chapter, data frame
    refers to a rectangular array of data organized into rows and columns.
- text: The entry at the intersection of one specimen and one variable in a data frame.
  justification: This describes value, not data frame. In this chapter, data frame
    refers to a rectangular array of data organized into rows and columns.
- text: A column in a data frame that records one property across its specimens.
  justification: This describes variable, not data frame. In this chapter, data frame
    refers to a rectangular array of data organized into rows and columns.
- text: Examining a system by breaking it into contributing components.
  justification: This describes analysis, not data frame. In this chapter, data frame
    refers to a rectangular array of data organized into rows and columns.
- text: Fundamental dimensions from which derived dimensions are formed.
  justification: This describes base dimensions, not data frame. In this chapter,
    data frame refers to a rectangular array of data organized into rows and columns.
- text: Fundamental SI units that are not defined in terms of one another.
  justification: This describes base units, not data frame. In this chapter, data
    frame refers to a rectangular array of data organized into rows and columns.

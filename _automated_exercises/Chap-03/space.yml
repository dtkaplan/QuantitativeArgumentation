word: space
for-chapter: 3
valid:
- A collection of quantities whose values identify locations within it.
- A multidimensional representation in which each point corresponds to a set of quantity
  values.
- A set of one or more quantities considered together as possible positions.
- A mathematical setting where locations represent combinations of values.
- A framework of quantities, such as a number line or coordinate plane, used to represent
  states.

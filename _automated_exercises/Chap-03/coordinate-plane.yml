word: coordinate plane
for-chapter: 3
valid:
- A two-dimensional space marked by two perpendicular number lines.
- A plane in which each point corresponds to a pair of coordinate values.
- A spatial representation for two quantities using intersecting horizontal and vertical
  axes.
- The two-dimensional collection of locations identified by coordinates on perpendicular
  axes.
- A way to represent paired quantity values as points on two intersecting number lines.
invalid:
- text: Dimensions formed by multiplying or dividing base dimensions.
  justification: This describes derived dimensions, not coordinate plane. In this
    chapter, coordinate plane refers to a two-dimensional space marked by two perpendicular
    number lines.
- text: Units formed by multiplying or dividing base units.
  justification: This describes derived units, not coordinate plane. In this chapter,
    coordinate plane refers to a two-dimensional space marked by two perpendicular
    number lines.
- text: Having the pure-number dimension, with no combination of base dimensions.
  justification: This describes dimensionless, not coordinate plane. In this chapter,
    coordinate plane refers to a two-dimensional space marked by two perpendicular
    number lines.
- text: Dimensionless ratios formed by dividing two exactly equal quantities.
  justification: This describes flavors of one, not coordinate plane. In this chapter,
    coordinate plane refers to a two-dimensional space marked by two perpendicular
    number lines.
- text: A one-dimensional line on which points represent values of a quantity.
  justification: This describes number line, not coordinate plane. In this chapter,
    coordinate plane refers to a two-dimensional space marked by two perpendicular
    number lines.
- text: Change in a primary quantity with respect to one variable while other variables
    are held constant.
  justification: This describes partial change, not coordinate plane. In this chapter,
    coordinate plane refers to a two-dimensional space marked by two perpendicular
    number lines.
- text: A word that signals division, with the following quantity in the denominator.
  justification: This describes per, not coordinate plane. In this chapter, coordinate
    plane refers to a two-dimensional space marked by two perpendicular number lines.
- text: A location in a space that corresponds to one or more coordinate values.
  justification: This describes point, not coordinate plane. In this chapter, coordinate
    plane refers to a two-dimensional space marked by two perpendicular number lines.
- text: A number with no unit designation, such as seven or pi.
  justification: This describes pure number, not coordinate plane. In this chapter,
    coordinate plane refers to a two-dimensional space marked by two perpendicular
    number lines.
- text: A standardized measure consisting of a pure number and a unit, optionally
    with a descriptor.
  justification: This describes quantity, not coordinate plane. In this chapter, coordinate
    plane refers to a two-dimensional space marked by two perpendicular number lines.

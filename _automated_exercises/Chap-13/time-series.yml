word: time series
for-chapter: 13
valid:
  - A function or sequence showing how a state quantity changes over time.
  - Values of a quantity recorded as a function of time.
  - A representation with time as input and the system's state as output.
  - A record of successive state values that reveals the pattern of change through time.
  - A time-indexed description of the quantity itself, rather than its rate of change.
invalid:
  - text: "A function that takes the current state as input and returns its rate of change."
    justification: "That is the dynamical rule; a time series takes time as input and returns the state."
  - text: "The set of all possible states a system could occupy."
    justification: "That is the state space; a time series shows how state changes over time."
  - text: "A single state value measured at one instant."
    justification: "A time series represents values across time, not just one instantaneous measurement."
  - text: "A list of data values sorted from smallest to largest."
    justification: "A time series is ordered by time, not by magnitude."
  - text: "A rule that determines the system's instantaneous direction of movement."
    justification: "That is the dynamical rule; the time series records the resulting state over time."
  - text: "A collection of multiple systems observed at the same instant."
    justification: "A time series tracks values over time, rather than a cross-section of systems."
  - text: "A path through state space that contains no information about time."
    justification: "A trajectory traces a state through time; a time series explicitly relates state to time."
  - text: "The total amount by which a quantity has changed since its initial value."
    justification: "A time series records state values; total change is a difference between values."
  - text: "A probability distribution for the time until a random event."
    justification: "That describes waiting-time uncertainty; a time series records observed state values through time."
  - text: "A table containing only the system's initial and final states."
    justification: "A time series can include successive observations across the time interval, not merely endpoints."

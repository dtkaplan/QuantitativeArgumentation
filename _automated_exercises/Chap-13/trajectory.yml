word: trajectory
for-chapter: 13
valid:
  - The path of a system's state through time, obtained by accumulating its instantaneous changes.
  - A function describing the state as it evolves from an initial condition.
  - The sequence or curve traced by a dynamical system as its state changes.
  - The time-evolving state produced by applying the dynamical rule and accounting method.
  - A record of where the system moves through state space over an interval of time.
invalid:
  - text: "A function mapping each state to its instantaneous rate of change."
    justification: "That is the dynamical rule; the trajectory gives the state as a function of time."
  - text: "The set of all possible states of the system."
    justification: "That is the state space; a trajectory is one path through it."
  - text: "The physical mechanism that causes the system to move."
    justification: "A trajectory is the resulting path of the state, not the mechanism."
  - text: "A single value specifying the system's initial configuration."
    justification: "That is an initial state; a trajectory traces the state over time."
  - text: "A curve showing the objective function's output for different choices."
    justification: "That is a graph of an objective function; a trajectory tracks system state over time."
  - text: "A list of possible future states with probabilities attached."
    justification: "That describes a probability distribution; a trajectory is a system's evolving path."
  - text: "The instantaneous rate of change at one point in state space."
    justification: "That is the dynamical rule's output; a trajectory accumulates such changes over time."
  - text: "A sequence of time values with no corresponding state values."
    justification: "A trajectory describes how the state evolves over time, not time alone."
  - text: "A rule that specifies how much a quantity changes each year."
    justification: "That describes a rate rule; the trajectory is the resulting state history."
  - text: "A guarantee that the system will revisit its starting state."
    justification: "Some trajectories may loop, but a trajectory generally means the evolving path, not a guaranteed return."

word: compound rates
for-chapter: 4
valid:
- Rates formed by arithmetic combinations of other rates.
- A rate with multiple divisions, such as calories per mile per pound.
- A quantity created by combining rates, whose interpretation depends on the order
  of operations.
- A rate that relates a numerator quantity to a product or ratio involving several
  other quantities.
- A composite rate whose units encode more than one context or multiplier.
invalid:
- text: A ratio of two quantities where division expresses a relationship between
    their underlying dimensions.
  justification: This describes rate, not compound rates. In this chapter, compound
    rates refers to rates formed by arithmetic combinations of other rates.
- text: The change in a primary quantity divided by the corresponding change in a
    context-setting quantity.
  justification: This describes rate of change, not compound rates. In this chapter,
    compound rates refers to rates formed by arithmetic combinations of other rates.
- text: A number format that condenses scientific notation into a single magnitude

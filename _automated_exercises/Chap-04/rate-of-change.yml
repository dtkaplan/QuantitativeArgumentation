word: rate of change
for-chapter: 4
valid:
- The change in a primary quantity divided by the corresponding change in a context-setting
  quantity.
- A ratio comparing how much one quantity changes to how much another quantity changes.
- A two-quantity measure that relates a primary change to a change with respect to
  another variable.
- The slope-like quantity formed from paired differences in output and input quantities.
- A measure of change per change in a second quantity, with units of primary quantity
  divided by context quantity.

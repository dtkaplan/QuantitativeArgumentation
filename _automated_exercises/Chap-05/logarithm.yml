word: logarithm
for-chapter: 5
valid:
- A number format that condenses scientific notation into a single magnitude value.
- A representation that folds the mantissa into a non-integer magnitude.
- A way to express the size of a pure number using one value rather than mantissa
  and exponent.
- A magnitude-based format for a pure number, such as 13.272 for 1.87 times ten to
  the thirteenth.
- A numerical encoding of magnitude that makes large and small values easier to compare.
